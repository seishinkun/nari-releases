name: Remove component checksum asset

on:
  push:
    paths:
      - ".github/workflows/remove-component-checksum.yml"

permissions:
  contents: write

jobs:
  clean-release:
    if: github.event.head_commit.message == 'Remove component checksum asset'
    runs-on: ubuntu-latest
    steps:
      - name: Remove component checksum asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete-asset v1.1.0 Nari-1.1.0-Components.sha256 --repo "$GITHUB_REPOSITORY" -y

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Nari 1.1.0 🌱

          First public release of Nari 1.1.

          Nari is a local AI streaming assistant designed to work with Streamer.bot.

          ## Included

          - Nari General Streamer.bot build
          - Nari Dashboard
          - Nari Voice Bridge
          - Nari Vision Bridge
          - Bundled whisper.cpp runtime and multilingual speech model for Voice Bridge

          ## Requirements

          - Windows x64
          - Streamer.bot
          - Ollama and the Nari AI model

          Nari ships paused by default. Complete the setup before enabling it.

          Full setup guide:
          https://naribot-nari14.vercel.app/en/setup/

          ## Download

          For a new installation, download the complete package:

          `Nari-1.1.0-Windows-x64.zip`

          Full-package SHA-256:
          `b9bb68a277fb673c3fbfd518a5176db8eb59e82477727e127b554c115721ee43`

          ## Optional component / repair downloads

          Already have Nari 1.1.0 installed? You do **not** need these separate downloads. They are provided only so you can replace an accidentally deleted or corrupted companion-app folder without downloading the complete package again.

          - `Nari-Dashboard-1.1.0-Windows-x64.zip`
          - `Nari-Voice-Bridge-1.1.0-Windows-x64.zip`
          - `Nari-Vision-Bridge-1.1.0-Windows-x64.zip`

          These component ZIPs are created directly from the matching folders inside the frozen Nari 1.1.0 full package so their versions stay aligned with this release.
          EOF

          gh release edit v1.1.0 --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
