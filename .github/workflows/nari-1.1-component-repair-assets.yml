name: Nari 1.1 component repair assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nari-1.1-component-repair-assets.yml"

permissions:
  contents: write

jobs:
  package-and-upload:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Add Nari 1.1 component repair assets'
    runs-on: ubuntu-latest

    steps:
      - name: Download frozen Nari 1.1.0 full package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/full
          gh release download v1.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Nari-1.1.0-Windows-x64.zip' \
            --dir work

      - name: Extract exact shipped components
        run: |
          set -euo pipefail
          unzip -q work/Nari-1.1.0-Windows-x64.zip -d work/full

          ROOT="$(find work/full -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          test -d "$ROOT/Nari Dashboard"
          test -d "$ROOT/Nari Voice Bridge"
          test -d "$ROOT/Nari Vision Bridge"

          BASE="$GITHUB_WORKSPACE/work"
          (
            cd "$ROOT"
            zip -qr "$BASE/Nari-Dashboard-1.1.0-Windows-x64.zip" "Nari Dashboard"
            zip -qr "$BASE/Nari-Voice-Bridge-1.1.0-Windows-x64.zip" "Nari Voice Bridge"
            zip -qr "$BASE/Nari-Vision-Bridge-1.1.0-Windows-x64.zip" "Nari Vision Bridge"
          )

      - name: Create component checksum manifest
        run: |
          set -euo pipefail
          cd work
          sha256sum \
            Nari-Dashboard-1.1.0-Windows-x64.zip \
            Nari-Voice-Bridge-1.1.0-Windows-x64.zip \
            Nari-Vision-Bridge-1.1.0-Windows-x64.zip \
            > Nari-1.1.0-Components.sha256

      - name: Upload repair assets to v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.1.0 \
            work/Nari-Dashboard-1.1.0-Windows-x64.zip \
            work/Nari-Voice-Bridge-1.1.0-Windows-x64.zip \
            work/Nari-Vision-Bridge-1.1.0-Windows-x64.zip \
            work/Nari-1.1.0-Components.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > work/release-notes.md <<'EOF'
          # Nari 1.1.0 🌱

          First public release of Nari 1.1.

          Nari is a local AI streaming assistant designed to work with Streamer.bot.

          ## Included

          - Nari General Streamer.bot build
          - Nari Dashboard
          - Nari Voice Bridge
          - Nari Vision Bridge
          - Bundled whisper.cpp runtime and multilingual speech model for Voice Bridge

          ## Requirements

          - Windows x64
          - Streamer.bot
          - Ollama and the Nari AI model

          Nari ships paused by default. Complete the setup before enabling it.

          Full setup guide:
          https://naribot-nari14.vercel.app/en/setup/

          ## Download

          For a new installation, download the complete package:

          `Nari-1.1.0-Windows-x64.zip`

          Full-package SHA-256:
          `b9bb68a277fb673c3fbfd518a5176db8eb59e82477727e127b554c115721ee43`

          ## Optional component / repair downloads

          Already have Nari 1.1.0 installed? You do **not** need these separate downloads. They are provided only so you can replace an accidentally deleted or corrupted companion-app folder without downloading the complete package again.

          - `Nari-Dashboard-1.1.0-Windows-x64.zip`
          - `Nari-Voice-Bridge-1.1.0-Windows-x64.zip`
          - `Nari-Vision-Bridge-1.1.0-Windows-x64.zip`
          - `Nari-1.1.0-Components.sha256` — checksums for the three component ZIPs

          These component ZIPs are created directly from the matching folders inside the frozen Nari 1.1.0 full package so their versions stay aligned with this release.
          EOF

          gh release edit v1.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file work/release-notes.md
